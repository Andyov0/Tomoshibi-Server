# /etc/nginx/conf.d/meet.conf
#
# An example reverse proxy in front of a control node or a single machine
# listening on 127.0.0.1:8080. Not part of this repository's code: adjust to
# your own nginx layout. Files in conf.d are included inside the http block,
# which is where the map below has to be.
#
# The server side must have:
#   meet.trust_proxy: true
#   meet.proxies: 1   (2 if a CDN sits in front of this nginx)
#
# With a CDN in front, accept connections from the CDN's addresses alone (an
# allow list, or the provider's authenticated origin pulls). Reached directly,
# this nginx passes on an X-Forwarded-For the caller wrote, and the address
# every limit and the sign-in lockout count is theirs to choose.
#
# Relays are NOT put behind this proxy or any CDN. Browsers dial each relay
# directly on its own ports.
#
# With meet.turnstile.exempt_local on (the default), a request that reaches
# 127.0.0.1:8080 from loopback without X-Forwarded-For, X-Real-IP or
# Forwarded is taken as a program on this machine and spared the human
# check. So every location that passes to the server sets X-Forwarded-For
# itself, as the one below does: a location that sets any proxy_set_header
# of its own inherits none from the server block, and a bare proxy_pass sends
# none. And nothing that forwards below HTTP may point at 127.0.0.1:8080 at
# all (HAProxy in mode tcp, socat, frp, a sing-box or xray port forward,
# ssh -L or -R, DNAT with route_localnet): it cannot add the header, so every
# caller through it would be spared and counted as 127.0.0.1. Where one is
# needed, set exempt_local to false.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name meet.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name meet.example.com;

    ssl_certificate     /etc/ssl/meet.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/meet.example.com/key.pem;

    # The largest body the server accepts is an avatar (96 KiB).
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # Appended, never replaced: the server counts meet.proxies entries in
        # from the right to find the caller. Set on every request, and never
        # removed: it is also how the server tells a request passed on from
        # here from a program on this machine, which meet.turnstile.exempt_local
        # spares the human check. Without it, every caller would be spared.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Replaced, never passed on from the caller: where
        # meet.turnstile.hostnames is empty, a token is held to this name, and
        # one the caller wrote would let a token solved on another site that
        # shares the widget in. Set hostnames anyway.
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Signalling WebSockets. Only a single machine (role full) carries them
        # on this origin; harmless on a control node.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A signalling socket stays open for the length of a meeting, and
        # music audio and relayed video are long streamed responses.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}
