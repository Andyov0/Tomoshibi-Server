# /etc/nginx/conf.d/meet.conf
#
# An example reverse proxy in front of a control node or a single machine
# listening on 127.0.0.1:8080. Not part of this repository's code: adjust to
# your own nginx layout. Files in conf.d are included inside the http block,
# which is where the map below has to be.
#
# The server side must have:
#   meet.trust_proxy: true
#   meet.proxies: 1   (2 if a CDN sits in front of this nginx)
#
# Relays are NOT put behind this proxy or any CDN. Browsers dial each relay
# directly on its own ports.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name meet.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name meet.example.com;

    ssl_certificate     /etc/ssl/meet.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/meet.example.com/key.pem;

    # The largest body the server accepts is an avatar (96 KiB).
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # Appended, never replaced: the server counts meet.proxies entries in
        # from the right to find the caller.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Signalling WebSockets. Only a single machine (role full) carries them
        # on this origin; harmless on a control node.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A signalling socket stays open for the length of a meeting, and
        # music audio and relayed video are long streamed responses.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}
