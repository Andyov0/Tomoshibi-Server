<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<!-- Day or night as the system says, before the stylesheet has arrived;
		     a call holds night on top of this (src/live/appearance.ts), and
		     says so to the toolbar by giving the day tag the night colour. -->
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0e0d" />
		<!-- Night from the first frame of a reload in the middle of a call, by
		     day as by night: this tab was in the room its address names, so
		     the page is on its way straight back into the call, and drawing
		     the join screen pale on the way there was a flash of day between
		     two dark frames. Read before the stylesheet arrives, from the key
		     wasIn reads (src/live/api.ts); src/live/appearance.ts counts it as
		     a hold and App lets it go once it knows where the page is going. -->
		<script>
			try {
				var was = sessionStorage.getItem("meet-live.was-in");
				var here = decodeURIComponent(location.hash.replace(/^#\/?/, "")).toLowerCase();
				if (was && was === here) document.documentElement.setAttribute("data-appearance", "night");
			} catch (e) {}
		</script>
		<title>Tomoshibi</title>
	</head>
	<!-- Marks the document a call is held in, which is the one that is not a
	     document: nothing in it is prose to drag across, and a long press has
	     to reach a menu rather than a text selection. The management pages
	     share this stylesheet and are a console to copy figures out of, so they
	     carry no such class. -->
	<body class="call">
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
