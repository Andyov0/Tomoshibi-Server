# Excerpt for the redis every relay shares. Not part of this repository's
# code: these are ordinary redis directives, shown as a starting point.
# Merge them into your distribution's redis.conf rather than replacing it.
#
# Every relay connects here, often across the internet. Allow only the relays'
# addresses through the firewall in front of this port; the password alone is
# not a reason to expose it to the world.
#
# No TLS here, as in the reference deployment (its redis.conf has no tls-port):
# the password and the cluster's traffic travel as plain TCP. Prefer a private
# network or a tunnel between the relays and redis, or configure redis's
# tls-port and the relays' redis.tls.

# Listen where the relays can reach it. Prefer a private address where the
# relays share a network with this machine.
bind 0.0.0.0
protected-mode yes
port 6379

# The password the relays carry (redis.password in every relay.yaml, and in the
# control node's file so enrolment can hand it out). See
# docs/deploy/cross-border.md for rotating it without a window.
requirepass <redis password>

# The reference deployment keeps these five commands disabled
# (dev/viahk/rotate-redis.md), but its redis.conf has no rename-command lines,
# so it does not disable them this way. (To be confirmed: how it does disable
# them, possibly with ACL rules.) rename-command, below, is one way; an ACL
# rule such as
# `user default on >PASSWORD ~* &* +@all -config -flushall -flushdb -shutdown -keys`
# is another (then without requirepass, which sets the same user's password).
# Re-enabling one to make an operation easier trades a standing protection for
# a convenience. ACL SETUSER, which password rotation uses, is not affected by
# these lines. Because CONFIG is disabled, CONFIG REWRITE cannot persist a
# rotated password: edit requirepass above by hand after rotating, or a redis
# restart brings back the old one.
rename-command CONFIG ""
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command SHUTDOWN ""
rename-command KEYS ""
