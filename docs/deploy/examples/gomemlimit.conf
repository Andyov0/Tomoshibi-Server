# /etc/systemd/system/tomoshibi-relay.service.d/gomemlimit.conf
#
# For a relay held under a systemd MemoryMax. A drop-in of its own, so taking
# it back is removing one file. Keep the limit below the ceiling: MemoryMax is
# compared against the cgroup's whole charge, kernel socket buffers included.
#
# Written the way Go reads it: 340MiB, not 340M or 340MB. A value Go cannot
# parse stops the relay at startup; a bare number is bytes.
#
#   systemctl daemon-reload && systemctl restart tomoshibi-relay
#   tr '\0' '\n' < /proc/$(systemctl show -p MainPID --value tomoshibi-relay)/environ | grep GOMEMLIMIT
#
# Restarting a relay ends every call on it. Do it with the fleet idle.

[Service]
Environment=GOMEMLIMIT=340MiB
